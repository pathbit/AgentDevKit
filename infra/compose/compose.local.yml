services:
  cli:
    image: node:24-bookworm
    working_dir: /workspace
    user: "1000:1000"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    environment:
      HOME: /tmp
    volumes:
      - type: bind
        source: ../..
        target: /workspace
        read_only: true
    entrypoint: [node, bin/agentdevkit.mjs]
    command: [--help]
