name: Security tools smoke

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.pbai4devs/scripts/auditar-seguranca/**'
      - '.pbai4devs/scripts/preparar-ferramentas/**'
      - '.pbai4devs/scripts/lib/native-release.mjs'
      - '.pbai4devs/tools/gitleaks/**'
      - '.pbai4devs/tools/osv-scanner/**'
      - '.pbai4devs/tools/opengrep/**'
      - '.github/workflows/security-tools.yml'
  pull_request:
    paths:
      - '.pbai4devs/scripts/auditar-seguranca/**'
      - '.pbai4devs/scripts/preparar-ferramentas/**'
      - '.pbai4devs/scripts/lib/native-release.mjs'
      - '.pbai4devs/tools/gitleaks/**'
      - '.pbai4devs/tools/osv-scanner/**'
      - '.pbai4devs/tools/opengrep/**'
      - '.github/workflows/security-tools.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Local scanners / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install reviewed local binaries
        run: node .pbai4devs/scripts/preparar-ferramentas/SCRIPT.mjs setup security
      - name: Scan synthetic fixtures offline
        run: node .pbai4devs/scripts/auditar-seguranca/tests/SMOKE.mjs
      - name: Save normalized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-smoke-${{ matrix.os }}-${{ github.sha }}
          path: |
            .agent-tests/security-smoke/**/REPORT.json
            .agent-tests/security-smoke/**/*-report.json
          if-no-files-found: ignore
          retention-days: 7
