name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Require a version tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the release reference
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release requires a version tag: vX.Y.Z. Use CI to build a branch package.'
            exit 1
          fi
  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download the package verified by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.package-artifact-id }}
          path: ${{ runner.temp }}/agentdevkit-package
          digest-mismatch: error
      - name: Publish verified package
        working-directory: ${{ runner.temp }}/agentdevkit-package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.package-version }}
          PACKAGE_SHA256: ${{ needs.verify.outputs.package-sha256 }}
        run: |
          test "$TAG" = "v$VERSION"
          printf '%s  %s\n' "$PACKAGE_SHA256" "agentdevkit-$VERSION.tgz" | sha256sum -c -
          sha256sum -c SHA256SUMS
          gh release create "$TAG" \
            "agentdevkit-$VERSION.tgz" SHA256SUMS \
            --verify-tag --title "AgentDevKit $TAG" \
            --notes-file NOTES.txt
