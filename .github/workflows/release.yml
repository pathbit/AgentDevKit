name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run pack:release
      - name: Test the exact release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          export AGENTDEVKIT_TARBALL="$PWD/.agent-tests/release/$VERSION/agentdevkit-$VERSION.tgz"
          node --test tests/distribution.test.mjs
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            ".agent-tests/release/$VERSION/agentdevkit-$VERSION.tgz" \
            ".agent-tests/release/$VERSION/SHA256SUMS" \
            --verify-tag --title "AgentDevKit $TAG" \
            --notes-file ".agent-tests/release/$VERSION/NOTES.txt"
