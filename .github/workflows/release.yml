name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente, por exemplo v0.0.5'
        type: string
        required: false
        default: ''
      package_only:
        description: Publicar somente no npm público
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Find the approved commit artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.source.outputs.artifact-id }}
      run-id: ${{ steps.source.outputs.run-id }}
      resolution: ${{ steps.source.outputs.resolution }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Wait for this commit's CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTDEVKIT_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release/publish.mjs resolve

  publish:
    name: Publish the verified bytes
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@pathbit'
      - name: Download the immutable CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact-id }}
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/agentdevkit-package
          digest-mismatch: error
      - name: Verify provenance and publish
        if: ${{ !inputs.package_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTDEVKIT_RELEASE_RESOLUTION: ${{ needs.resolve.outputs.resolution }}
          AGENTDEVKIT_ARTIFACT_DIR: ${{ runner.temp }}/agentdevkit-package
        run: node scripts/release/publish.mjs publish
      - name: Publish the same tarball to public npm
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          AGENTDEVKIT_RELEASE_RESOLUTION: ${{ needs.resolve.outputs.resolution }}
          AGENTDEVKIT_ARTIFACT_DIR: ${{ runner.temp }}/agentdevkit-package
        run: node scripts/release/packages.mjs publish
