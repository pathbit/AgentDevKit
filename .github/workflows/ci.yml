name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:
    outputs:
      package-version:
        description: Version of the verified package
        value: ${{ jobs.package.outputs.version }}
      package-sha256:
        description: SHA-256 of the verified tarball
        value: ${{ jobs.package.outputs.sha256 }}
      package-artifact-id:
        description: Immutable artifact ID for the verified package
        value: ${{ jobs.package.outputs.artifact-id }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:infra
      - name: Install Markdown validator
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node .pbai4devs/scripts/preparar-ferramentas/SCRIPT.mjs install markdownlint-cli2
      - run: npm run check

  package:
    name: Verified package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run pack:release
      - id: bundle
        name: Select the package and record its checksum
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const directory = `.agent-tests/release/${version}`;
          const { sha256 } = JSON.parse(readFileSync(`${directory}/package-manifest.json`, 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nsha256=${sha256}\n`);
          appendFileSync(process.env.GITHUB_ENV, `AGENTDEVKIT_TARBALL=${process.cwd()}/${directory}/agentdevkit-${version}.tgz\n`);
          NODE
      - name: Test the exact package
        run: npm run test:distribution
      - name: Stage only the distribution files
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/agentdevkit-package"
          DIRECTORY=".agent-tests/release/$VERSION"
          cp "$DIRECTORY/agentdevkit-$VERSION.tgz" "$DIRECTORY/SHA256SUMS" \
            "$DIRECTORY/NOTES.txt" "$DIRECTORY/package-manifest.json" \
            "$RUNNER_TEMP/agentdevkit-package/"
      - name: Upload verified package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentdevkit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentdevkit-package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
