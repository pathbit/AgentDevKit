name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  minimum-runtime:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux / Node 18 / minimum runtime
          - os: windows-latest
            label: Windows / Node 18 / minimum runtime
          - os: macos-15-intel
            label: macOS / Node 18 / minimum runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.0
      - name: Record the prepared runtime
        env:
          NODE_OPTIONS: ''
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'ADK_TEST_NODE24=' + process.execPath + String.fromCharCode(10))"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 18.20.8
      - name: Verify the declared minimum runtime
        env:
          NODE_OPTIONS: ''
          ADK_EXPECT_NODE18: '1'
        run: node --test tests/runtime-minimum.test.mjs

  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
            profile: full
            label: Linux / Node 24 / complete
          - os: windows-latest
            node: 24
            profile: portable-cli
            label: Windows / Node 24 / CLI
          - os: windows-latest
            node: 24
            profile: portable-source-integration
            label: Windows / Node 24 / source integration
          - os: windows-latest
            node: 24
            profile: portable-selection
            label: Windows / Node 24 / client selection
          - os: windows-latest
            node: 24
            profile: portable-selection-lifecycle
            label: Windows / Node 24 / client lifecycle
          - os: windows-latest
            node: 24
            profile: portable-selection-codex
            label: Windows / Node 24 / Codex obstructions
          - os: windows-latest
            node: 24
            profile: portable-selection-all-root
            label: Windows / Node 24 / all-client root obstructions
          - os: windows-latest
            node: 24
            profile: portable-selection-all-leaf
            label: Windows / Node 24 / all-client leaf obstructions
          - os: windows-latest
            node: 24
            profile: portable-projects
            label: Windows / Node 24 / projects
          - os: windows-latest
            node: 24
            profile: portable-projects-git
            label: Windows / Node 24 / Git preservation
          - os: windows-latest
            node: 24
            profile: portable-projects-callbacks
            label: Windows / Node 24 / isolated callbacks
          - os: windows-latest
            node: 24
            profile: portable-projects-matrix
            label: Windows / Node 24 / native coexistence and matrix
          - os: windows-latest
            node: 24
            profile: portable-recovery
            label: Windows / Node 24 / recovery and metadata
          - os: windows-latest
            node: 24
            profile: portable-recovery-metadata
            label: Windows / Node 24 / recovery metadata and staging
          - os: windows-latest
            node: 24
            profile: portable-migration
            label: Windows / Node 24 / migration and preservation
          - os: windows-latest
            node: 24
            profile: portable-resources
            label: Windows / Node 24 / resources
          - os: windows-latest
            node: 24
            profile: portable-resources-clients
            label: Windows / Node 24 / client resources
          - os: windows-latest
            node: 24
            profile: portable-claude-rule-cli
            label: Windows / Node 24 / Claude rule CLI
          - os: windows-latest
            node: 24
            profile: portable-resources-managed
            label: Windows / Node 24 / managed resources
          - os: windows-latest
            node: 24
            profile: portable-resources-gemini
            label: Windows / Node 24 / Gemini resources
          - os: windows-latest
            node: 24
            profile: portable-resources-gemini-staged
            label: Windows / Node 24 / staged Gemini TOML
          - os: windows-latest
            node: 24
            profile: portable-sync-core
            label: Windows / Node 24 / sync core scripts
          - os: windows-latest
            node: 24
            profile: portable-sync-ownership
            label: Windows / Node 24 / sync ownership scripts
          - os: windows-latest
            node: 24
            profile: portable-sync-preservation
            label: Windows / Node 24 / sync preservation scripts
          - os: windows-latest
            node: 24
            profile: portable-layout
            label: Windows / Node 24 / layout
          - os: macos-15-intel
            node: 24
            profile: portable-cli
            label: macOS / Node 24 / CLI
          - os: macos-15-intel
            node: 24
            profile: portable-source-integration
            label: macOS / Node 24 / source integration
          - os: macos-15-intel
            node: 24
            profile: portable-selection
            label: macOS / Node 24 / client selection
          - os: macos-15-intel
            node: 24
            profile: portable-selection-lifecycle
            label: macOS / Node 24 / client lifecycle
          - os: macos-15-intel
            node: 24
            profile: portable-selection-codex
            label: macOS / Node 24 / Codex obstructions
          - os: macos-15-intel
            node: 24
            profile: portable-selection-all-root
            label: macOS / Node 24 / all-client root obstructions
          - os: macos-15-intel
            node: 24
            profile: portable-selection-all-leaf
            label: macOS / Node 24 / all-client leaf obstructions
          - os: macos-15-intel
            node: 24
            profile: portable-projects
            label: macOS / Node 24 / projects
          - os: macos-15-intel
            node: 24
            profile: portable-projects-git
            label: macOS / Node 24 / Git preservation
          - os: macos-15-intel
            node: 24
            profile: portable-projects-callbacks
            label: macOS / Node 24 / isolated callbacks
          - os: macos-15-intel
            node: 24
            profile: portable-projects-matrix
            label: macOS / Node 24 / native coexistence and matrix
          - os: macos-15-intel
            node: 24
            profile: portable-recovery
            label: macOS / Node 24 / recovery and metadata
          - os: macos-15-intel
            node: 24
            profile: portable-recovery-metadata
            label: macOS / Node 24 / recovery metadata and staging
          - os: macos-15-intel
            node: 24
            profile: portable-migration
            label: macOS / Node 24 / migration and preservation
          - os: macos-15-intel
            node: 24
            profile: portable-resources
            label: macOS / Node 24 / resources
          - os: macos-15-intel
            node: 24
            profile: portable-resources-clients
            label: macOS / Node 24 / client resources
          - os: macos-15-intel
            node: 24
            profile: portable-claude-rule-cli
            label: macOS / Node 24 / Claude rule CLI
          - os: macos-15-intel
            node: 24
            profile: portable-resources-managed
            label: macOS / Node 24 / managed resources
          - os: macos-15-intel
            node: 24
            profile: portable-resources-gemini
            label: macOS / Node 24 / Gemini resources
          - os: macos-15-intel
            node: 24
            profile: portable-resources-gemini-staged
            label: macOS / Node 24 / staged Gemini TOML
          - os: macos-15-intel
            node: 24
            profile: portable-sync-core
            label: macOS / Node 24 / sync core scripts
          - os: macos-15-intel
            node: 24
            profile: portable-sync-ownership
            label: macOS / Node 24 / sync ownership scripts
          - os: macos-15-intel
            node: 24
            profile: portable-sync-preservation
            label: macOS / Node 24 / sync preservation scripts
          - os: macos-15-intel
            node: 24
            profile: portable-layout
            label: macOS / Node 24 / layout
          - os: macos-15-intel
            node: 24
            profile: native-macos-metadata
            label: macOS / Node 24 / native metadata gate
          - os: ubuntu-latest
            node: 26
            profile: smoke
            label: Linux / Node 26 / compatibility
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Linux metadata test tools
        if: runner.os == 'Linux' && matrix.profile == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y attr acl
      - name: Verify the selected profile
        env:
          NODE_OPTIONS: ''
          ADK_REQUIRE_LINUX_XATTR: ${{ runner.os == 'Linux' && matrix.profile == 'full' && '1' || '0' }}
        run: node scripts/release/pipeline.mjs ${{ matrix.profile }} --github-output
        id: verify
      - name: Store the verified package
        if: matrix.profile == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentdevkit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.verify.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
