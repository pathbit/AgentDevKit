name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
            profile: full
            label: Linux / Node 24 / complete
          - os: windows-latest
            node: 24
            profile: portable
            label: Windows / Node 24 / portability
          - os: macos-latest
            node: 24
            profile: portable
            label: macOS / Node 24 / portability
          - os: ubuntu-latest
            node: 26
            profile: smoke
            label: Linux / Node 26 / compatibility
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the selected profile
        run: node scripts/release/pipeline.mjs ${{ matrix.profile }}
      - name: Store the verified package
        if: matrix.profile == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentdevkit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentdevkit-package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
