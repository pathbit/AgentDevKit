# Gerado por AgentDevKit; sincronizacao instalada nao depende do pacote npm.
# tipo|cliente|recurso ou layout|formato ou metadados
# antigravity: Grupos são registrados em manifests nativos; o scan padrão alcança apenas um nível.
agente|.agents|agrupado
formato|.agents|skills|agrupado
formato|.agents|agents|plano
formato|.agents|rules|agrupado
descoberta|.agents|antigravity
nativo|.agents/agents/revisor.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/antigravity.yaml
# antigravity-legacy: Alias legado; a descoberta agrupada é registrada pelo cliente principal .agents.
agente|.agent|agrupado
formato|.agent|skills|agrupado
formato|.agent|agents|plano
formato|.agent|rules|agrupado
nativo|.agent/agents/revisor.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/antigravity.yaml
# claude: Skills e agentes usam o nível documentado; comandos e regras preservam grupos. Monorepos não equivalem a grupos dentro de skills/.
agente|.claude|agrupado
formato|.claude|skills|plano
formato|.claude|agents|plano
formato|.claude|commands|arquivo
nativo|.claude/agents/revisor.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/claude.yaml
# codex: Skills agrupadas; a entrada nativa de projeto é .agents/skills. Outros recursos em .codex são referências, não registros de agentes.
agente|.codex|agrupado
formato|.codex|skills|agrupado
# cursor: Skills e regras aceitam grupos. Agentes e comandos mantêm o formato direto documentado; recursão desses dois tipos não foi confirmada.
agente|.cursor|agrupado
formato|.cursor|skills|agrupado
formato|.cursor|agents|plano
formato|.cursor|commands|plano
formato|.cursor|rules|mdc
nativo|.cursor/agents/revisor.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/cursor.yaml
nativo|.cursor/rules/ambiente-local.mdc|.pbai4devs/rules/ambiente-local/RULE.md|.pbai4devs/rules/ambiente-local/cursor.yaml
nativo|.cursor/rules/documentacao.mdc|.pbai4devs/rules/documentacao/RULE.md|.pbai4devs/rules/documentacao/cursor.yaml
nativo|.cursor/rules/estrutura.mdc|.pbai4devs/rules/estrutura/RULE.md|.pbai4devs/rules/estrutura/cursor.yaml
nativo|.cursor/rules/git.mdc|.pbai4devs/rules/git/RULE.md|.pbai4devs/rules/git/cursor.yaml
nativo|.cursor/rules/qualidade.mdc|.pbai4devs/rules/qualidade/RULE.md|.pbai4devs/rules/qualidade/cursor.yaml
# copilot: O scanner CLI/SDK de skills usa subpastas imediatas. Instruções preservam grupos; prompts .prompt.md atendem ao harness Local, não substituem skills Copilot.
agente|.github|agrupado
formato|.github|skills|plano
formato|.github|agents|agente
formato|.github|commands|prompt
formato|.github|rules|instrucoes
nativo|.github/agents/revisor.agent.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/github.yaml
# opencode: OpenCode V2 busca SKILL.md em grupos até seis níveis; agentes e comandos aceitam caminhos aninhados. rules/ contém referências, não descoberta nativa.
agente|.opencode|agrupado
formato|.opencode|skills|agrupado
formato|.opencode|agents|arquivo
formato|.opencode|commands|arquivo
nativo|.opencode/agents/revisor.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/opencode.yaml
# gemini: Skills usam SKILL.md ou */SKILL.md e agentes usam *.md direto. Comandos TOML são recursivos; rules/ contém referências.
agente|.gemini|agrupado
formato|.gemini|skills|plano
formato|.gemini|agents|plano
formato|.gemini|commands|arquivo
nativo|.gemini/agents/revisor.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/gemini.yaml
# zcode: O layout documentado de skills é plano; plugins ignoram grupos. Subagentes de projeto não são confirmados, portanto permanecem referências agrupadas.
agente|.zcode|agrupado
formato|.zcode|skills|plano
formato|.zcode|commands|plano
# kimi: O scanner atual percorre agrupadores sem SKILL.md. Comandos precisam de plugin configurado; outros apontamentos não prometem descoberta nativa.
agente|.kimi-code|agrupado
formato|.kimi-code|skills|agrupado
formato|.kimi-code|agents|plano
nativo|.kimi-code/agents/revisor.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/kimi-code.yaml
# kimi-legacy: Compatibilidade com instalações legadas; o cliente atual usa .kimi-code e .agents.
agente|.kimi|agrupado
formato|.kimi|skills|plano
# minimax: O scanner enumera filhos diretos da raiz e lê <nome>/SKILL.md. Agentes, comandos e regras do projeto permanecem referências.
agente|.minimax|agrupado
formato|.minimax|skills|plano
# mimo: Skills usam **/SKILL.md. Agentes e comandos mantêm o nível documentado; rules/ contém referências.
agente|.mimocode|agrupado
formato|.mimocode|skills|agrupado
formato|.mimocode|agents|plano
formato|.mimocode|commands|plano
nativo|.mimocode/agents/revisor.md|.pbai4devs/agents/revisor/AGENT.md|.pbai4devs/agents/revisor/mimocode.yaml
# deepseek: O provider oficial descobre apenas <nome>/SKILL.md ou <nome>.md direto e exclui árvores aninhadas. Outros tipos são referências.
agente|.dsh|agrupado
formato|.dsh|skills|plano
gitignore|.vscode
